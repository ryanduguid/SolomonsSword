[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "louisgoldberg"
version = "0.1.1"
description = "Trust distribution allocation, Section 100A / 99B risk evaluation, and Division 6 ITAA 1936 compliance for Australian trusts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "australian-tax",
    "trust-accounting",
    "section-100a",
    "section-99b",
    "division-6",
    "bamford",
    "itaa1936",
    "accounting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11",
    "mypy>=1.14",
]

[project.scripts]
louisgoldberg = "louisgoldberg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["louisgoldberg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=louisgoldberg --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["louisgoldberg", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax/undefined-name errors only. Keep Decimal("10.00")
# money literals; do not import-sort the existing test corpus in this change.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
packages = ["louisgoldberg"]
pretty = true
