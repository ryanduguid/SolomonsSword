[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solomons-sword"
version = "0.1.0"
description = "Trust distribution allocation, Section 100A / 99B risk evaluation, and Division 6 ITAA 1936 compliance for Australian trusts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Duguid", email = "ryan@duguid.com.au" }
]
keywords = [
    "australian-tax",
    "trust-accounting",
    "section-100a",
    "section-99b",
    "division-6",
    "bamford",
    "itaa1936",
    "accounting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
trust-allocate = "solomonssword.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["solomonssword"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]